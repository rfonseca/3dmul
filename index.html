<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>

    </style>
    <script src="aframe.min.js"></script>
    <script src="aframe-orbit-controls-component.min.js"></script>
    <script>
        var X = 10;
        var Y = 10;
        var Z = 10;
        var boxes = [];
        var state = {
            x : 1,
            y : 1,
            z : 1
        }
        function updateTarget() {
            var t = document.getElementById('target');
            t.setAttribute('position', { x: state.x/2, y: state.y/2, z: state.z/2 }); 
        }
        function updateVisibility() {
            for (i = 0; i < X; i++) {
                for (j = 0; j < Y; j++) {
                    for (k = 0; k < Z; k++) {
                        boxes[i][j][k].setAttribute('visible', (i < state.x && j < state.y && k < state.z)) ;
                    }
                }
            }
        }
        function updateSlider(el) {
            if (el.id == 'sl-x') {
                state.x = el.value;
                document.getElementById('sp-x').innerHTML = el.value;
            } else if (el.id == 'sl-y') {
                state.z = el.value;
                document.getElementById('sp-y').innerHTML = el.value;
            } else if (el.id == 'sl-z') {
                state.y = el.value;
                document.getElementById('sp-z').innerHTML = el.value;
            } else {     
                alert('invalid slider');
            }
            document.getElementById('sp-mul').innerHTML = state.x*state.y*state.z;
            updateTarget();
            updateVisibility();
        }
    </script>
  </head>
  <body>
    <h1>Seeing the multiplication of 3 numbers</h1>

    Move the sliders to change the number of boxes!<br>
    Move the mouse around to rotate the boxes.

    <div>
  <label for="sl-x">Width</label>
  <input type="range" id="sl-x" name="sl-x" min="1" max="10" value="4" step="1" oninput="updateSlider(this)">
  <label for="sl-y">Depth</label>
  <input type="range" id="sl-y" name="sl-y" min="1" max="10" value="3" step="1" oninput="updateSlider(this)">
  <label for="sl-z">Height</label>
  <input type="range" id="sl-z" name="sl-z" min="1" max="10" value="2" step="1" oninput="updateSlider(this)">
</div>
<div>
  <h2><span id='sp-x'>1</span> X 
  <span id='sp-y'>1</span> X
  <span id='sp-z'>1</span> =
  <span id='sp-mul'></span> </h2>
</div>
    <a-scene embedded style="width: 80vw; height: 80vh;">
      <a-sky color="#ECECEC"></a-sky>
    <a-entity
          id="camera"
          camera="fov: 70; zoom: 4;"
          position="20 20 20"
          orbit-controls="
              autoRotate: false;
              target: #target;
              enableDamping: true;
              dampingFactor: 0.125;
              rotateSpeed:0.25;
              minDistance:3;
              maxDistance:100;
              "
          mouse-cursor="">
          <a-entity geometry="primitive:cone; radius-bottom:1; radius-top:0" scale=".33 1 .33" position="0 0 0" rotation="90 0 0" material="color: #0099ff; transparent: true; opacity:0.5"></a-entity>
          <a-box id="target" position="0,0,0"></a-box>
    </a-entity>
    </a-scene>
    <script>
        var scene = document.querySelector('a-scene')
        var spacing = 1*1.3;
        var c = document.createElement('a-entity');
        c.setAttribute('id','target2');
        scene.appendChild(c);
        for (i = 0; i < X; i++) {
            boxes[i] = [];
            for (j = 0; j < Y; j++) {
                boxes[i][j] = [];
                for (k = 0; k < Z; k++) {
                    boxes[i][j][k] =  document.createElement('a-box'); 
                    boxes[i][j][k].setAttribute('material', {color: new THREE.Color(i/X*0.8+0.1, j/Y*0.8+0.1, k/Z*0.8+0.1)});
                    boxes[i][j][k].setAttribute('material', {color: new THREE.Color((X-i)/X*0.8+0.1, (Y-j)/Y*0.8+0.1, k/Z*0.8+0.1)});
                    boxes[i][j][k].setAttribute('position', {x: (i)*spacing, y: (j)*spacing, z: (k)*spacing});
                    boxes[i][j][k].setAttribute('visible', (i < state.x && j < state.y && k < state.z)) ;
                    c.appendChild(boxes[i][j][k]);
                }
            }
        }
        updateSlider(document.getElementById('sl-x'));
        updateSlider(document.getElementById('sl-y'));
        updateSlider(document.getElementById('sl-z'));
    </script>
  </body>
</html>
